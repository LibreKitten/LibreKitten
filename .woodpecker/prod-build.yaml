# https://cjerrington.codeberg.page/eleventy-base-blog-site/blog/codebergpagesbuild/
#
# This is also inspired by https://codeberg.org/ampmod/ampmod/src/branch/develop/.woodpecker/canary.yaml
#
# SECRETS
# https://woodpecker-ci.org/docs/usage/secrets
# CBTOKEN needs a codeberg access token as secret in woodpecker config
# CBMAIL with email address for git config
# SOURCEREPO must be replaced with the source repo
# DESTREPO must be replaced with the target codeberg pages repo
# CBUSERNAME must be replaced with the user/org
#
#
# We also assume a domains file in the source repo that gets copied to
# .domains in the target repo so codeberg pages works for custom domains
#

steps:
  - name: build
    when:
      - event: [push, manual]
        branch: prod
        path: ['packages/*/src/**/*', 'packages/*/package.json', 'package.json', '.woodpecker/*']
    image: node:22-alpine3.22
    environment:
      HUSKY: 0
    commands:
      # Install dependencies
      - apk add --no-cache openjdk21 python3
      # Avoid permission denied errors
      - chmod -R a+w .
      # Enable corepack
      - corepack enable
      # Run build stage
      - pnpm install --frozen-lockfile
      - pnpm run prepublish
      - NODE_ENV=production pnpm run gui-ci-build

  - name: push
    when:
      - event: [push, manual]
        branch: prod
        path: ['packages/*/src/**/*', 'packages/*/package.json', 'package.json', '.woodpecker/*']
    image: alpine/git
    environment:
      CBTOKEN:
        from_secret: cbtoken
    commands:
      # Set up git in a working way
      - git config --global --add safe.directory /woodpecker/src/codeberg.org/LibreKitten/LibreKitten-gui/build
      - git config --global user.email "no@thankyou.com"
      - git config --global user.name "CI Builder"
      # Clone and enter the target repo
      - cd ..
      - git clone --depth=1 -b main https://codeberg.org/LibreKitten/pages.git lk-build
      - chmod -R a+w lk-build
      - cd lk-build
      # Prepare for push
      - git rm -rf --ignore-unmatch ./**/* ./*
      - git remote set-url origin https://$CBTOKEN@codeberg.org/LibreKitten/pages.git
      # Push to target
      - cp -a ../LibreKitten/packages/gui/build/. .
      - echo "librekitten.org" > .domains
      - git add --all
      - git commit -m "Woodpecker CI Build at $( env TZ=America/Chicago date +"%Y-%m-%d %X %Z" )"
      - git push -u origin main